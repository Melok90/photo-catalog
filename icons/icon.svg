<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E5EA"/>
      <stop offset="50%" stop-color="#8E8E93"/>
      <stop offset="100%" stop-color="#D1D1D6"/>
    </linearGradient>
    <radialGradient id="aperture" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="50%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0040DD"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Camera Outer Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#lensRing)" stroke-width="12"/>
  <circle cx="256" cy="256" r="148" fill="#121214"/>

  <!-- Aperture Inner Ring -->
  <circle cx="256" cy="256" r="100" fill="url(#aperture)"/>

  <!-- Specular Lens Glint Reflection -->
  <circle cx="225" cy="225" r="28" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="215" cy="215" r="12" fill="#FFFFFF" opacity="0.85"/>

  <!-- Flash LED dot -->
  <circle cx="370" cy="142" r="16" fill="#FFCC00"/>
</svg>
